name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: write

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      publish_mode: release
    secrets: inherit

  create-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download release artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      # The static catalog the game falls back to when Firestore is rate
      # limited or down; which mods it lists is cherry-picked in catalog.toml.
      - name: Generate catalog.json
        run: |
          python scripts/gen_catalog.py             --assets release-assets             --repo "${{ github.repository }}"             --tag "${{ github.ref_name }}"             --output release-assets/catalog.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Eternal Sonata: Reprise Mods ${{ github.ref_name }}"
          body: "Mods for [Eternal Sonata: Reprise](https://github.com/birabittoh/EternalSonataReprise).\n"
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
