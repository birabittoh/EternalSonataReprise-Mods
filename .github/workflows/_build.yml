name: Build mods

on:
  workflow_call:
    inputs:
      publish_mode:
        description: "'artifact' for CI workflow-artifact, 'release' for GitHub release"
        required: true
        type: string
      mod_artifact_suffix:
        description: "Suffix appended to each per-mod artifact name, e.g. '-<short-sha>'"
        required: false
        type: string
        default: ""

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - win-amd64
          - linux-amd64
          - linux-arm64
          - mac-amd64
          - mac-arm64
          - android-arm64
        include:
          - platform: win-amd64
            runner: windows-latest

          - platform: linux-amd64
            runner: ubuntu-latest

          - platform: linux-arm64
            runner: ubuntu-24.04-arm

          - platform: mac-amd64
            runner: macos-15-intel

          - platform: mac-arm64
            runner: macos-15

          # Cross-built with the NDK the runner already ships at
          # $ANDROID_NDK_HOME, so no clang install step here.
          - platform: android-arm64
            runner: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: startsWith(matrix.platform, 'linux-')
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20
          sudo apt-get install -y ninja-build
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-20 200
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-20 200

      - name: Install Ninja (Android)
        if: matrix.platform == 'android-arm64'
        run: sudo apt-get install -y ninja-build

      - name: Install LLVM, CMake, Ninja (Windows)
        if: matrix.platform == 'win-amd64'
        run: choco install llvm cmake ninja -y

      - name: Set up sccache
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          variant: sccache
          key: ${{ matrix.platform }}

      - name: Download SDK
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/download-sdk.py "sdk/${{ matrix.platform }}" --pinned --platform ${{ matrix.platform }}

      - name: Build mods
        shell: bash
        run: python scripts/make_mods.py --target ${{ matrix.platform }} --sdk-dir sdk

      # Raw, per-platform build output, not zipped yet. The `package` job
      # below downloads every platform's raw output and merges them so
      # each mod ends up in a single zip with every platform's binaries
      # under code/<platform>/
      - name: Upload raw build output
        uses: actions/upload-artifact@v4
        with:
          name: raw-mods-${{ matrix.platform }}
          path: mods/
          if-no-files-found: error

      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true

  package:
    name: Package (one zip per mod)
    needs: build
    runs-on: ubuntu-latest
    outputs:
      mods: ${{ steps.merge.outputs.mods }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download raw build output
        uses: actions/download-artifact@v4
        with:
          pattern: raw-mods-*
          path: raw

      - name: Merge platforms and zip each mod
        id: merge
        shell: bash
        run: |
          python scripts/merge_and_package.py \
            --input raw/raw-mods-win-amd64 \
            --input raw/raw-mods-linux-amd64 \
            --input raw/raw-mods-linux-arm64 \
            --input raw/raw-mods-mac-amd64 \
            --input raw/raw-mods-mac-arm64 \
            --input raw/raw-mods-android-arm64 \
            --output pkg \
            --write-mod-list mods.json \
            --merged-output merged
          echo "mods=$(cat mods.json)" >> "$GITHUB_OUTPUT"

      # A temporary staging artifact so the per-mod matrix job below (which
      # runs in fresh runners) can get at each mod's merged, unzipped tree.
      # Raw dirs, not pkg/*.zip -- upload-artifact zips whatever it's given,
      # so re-uploading an already-zipped file produces a zip-of-a-zip.
      # Deleted by the cleanup job once every per-mod artifact has been
      # split out of it.
      - name: Upload staging artifact
        if: inputs.publish_mode == 'artifact'
        uses: actions/upload-artifact@v4
        with:
          name: pkg-staging-${{ github.run_id }}
          path: merged/
          if-no-files-found: error
          retention-days: 1

      - name: Upload release artifact
        if: inputs.publish_mode == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: release-mods
          path: pkg/
          if-no-files-found: error

  publish-per-mod:
    name: Publish artifact (${{ matrix.mod }})
    needs: package
    if: inputs.publish_mode == 'artifact'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mod: ${{ fromJson(needs.package.outputs.mods) }}
    steps:
      - name: Download staging artifact
        uses: actions/download-artifact@v4
        with:
          name: pkg-staging-${{ github.run_id }}
          path: merged

      # upload-artifact zips whatever directory `path:` points at, but drops
      # that directory's own name from the archive -- pointing straight at
      # merged/<mod> would produce a zip whose files sit at the root instead
      # of under a <mod>/ folder. Wrapping it one level deeper so the mod
      # name is a *child* of the upload root is what makes it survive.
      - name: Stage ${{ matrix.mod }} under its own folder
        run: |
          mkdir -p "stage/${{ matrix.mod }}"
          mv "merged/${{ matrix.mod }}" "stage/${{ matrix.mod }}/${{ matrix.mod }}"

      - name: Upload ${{ matrix.mod }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.mod }}${{ inputs.mod_artifact_suffix }}
          path: stage/${{ matrix.mod }}
          if-no-files-found: error

  cleanup:
    name: Remove intermediate artifacts
    needs: [build, package, publish-per-mod]
    if: always() && inputs.publish_mode == 'artifact' && needs.publish-per-mod.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete raw per-platform and staging artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ids=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --paginate \
            --jq '.artifacts[] | select(.name | startswith("raw-mods-") or startswith("pkg-staging-")) | .id')
          for id in $ids; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done
